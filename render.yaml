databases:
  - name: rc101-radio-db
    plan: free
    databaseName: rc101_radio
    user: rc101_radio

services:
  - type: web
    name: rc101-radio
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: APP_NAME
        value: "RC 101"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: rc101-radio-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: rc101-radio-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: rc101-radio-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: rc101-radio-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: rc101-radio-db
          property: password
      - key: DEFAULT_ARTWORK_PATH
        value: images/mp-default-logo.jpg
      - key: SOCIAL_SHARE_IMAGE
        value: images/social-banner.png
      - key: SLOGAN_FILE_PATH
        value: config/slogan.txt
      - key: STREAM_URL
        value: https://streams.radiomast.io/rc101
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
